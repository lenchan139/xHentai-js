name: Build userscript

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ehentai-app.user.js'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'shots/**'
      - 'test/**'

permissions:
  contents: write

concurrency:
  group: build-userscript
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit rebuilt userscript
        run: |
          if git diff --quiet -- ehentai-app.user.js; then
            echo "userscript is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ehentai-app.user.js
          git commit -m "chore: rebuild userscript [skip ci]"
          git push
